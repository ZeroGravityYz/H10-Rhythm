apply plugin: 'com.android.application'

def signingFile = rootProject.file('keystore.properties')
def signingValues = new Properties()
if (signingFile.exists()) {
    signingFile.withInputStream { signingValues.load(it) }
}

android {
    namespace 'com.local.polarh10monitor'
    compileSdk 35

    defaultConfig {
        applicationId 'com.local.polarh10monitor'
        minSdk 26
        targetSdk 35
        versionCode 4
        versionName '2.1.0'
    }

    signingConfigs {
        publication {
            if (signingFile.exists()) {
                storeFile rootProject.file(signingValues['storeFile'])
                storePassword signingValues['storePassword']
                keyAlias signingValues['keyAlias']
                keyPassword signingValues['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingFile.exists() ? signingConfigs.publication : signingConfigs.debug
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
