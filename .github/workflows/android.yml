name: Android checks

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Make Gradle executable
        run: chmod +x gradlew
      - name: Compile and inspect
        run: ./gradlew assembleDebug lintDebug
